<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Manajemen Sertifikat - SINKARKES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4f46e5; border-radius: 4px; }

</head>
<body class="antialiased">

                <p id="admin-stats" class="text-sm text-gray-400"></p>
            </div>
            <button id="logout-btn" class="mt-4 sm:mt-0 flex items-center px-4 py-2 bg-red-600/50 hover:bg-red-600/80 text-white rounded-lg transition-colors">
                <i class="fa fa-sign-out-alt mr-2"></i> Logout
            </button>
        </header>

        <!-- Kontrol & Aksi -->
        <div class="glass-card p-4 rounded-xl mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-end">
                <div class="lg:col-span-2">
                    <label for="search-input" class="text-sm font-medium text-gray-300">Cari Nama / No. Dokumen</label>
                    <input type="text" id="search-input" placeholder="Ketik untuk mencari..." class="form-input w-full mt-1 p-2 rounded-lg">

                 <div class="grid grid-cols-2 gap-4">

                        <input type="date" id="tanggal_awal" class="form-input w-full mt-1 p-2 rounded-lg">
                    </div>
                    <div>
                        <label for="tanggal_akhir" class="text-sm font-medium text-gray-300">Sampai Tanggal</label>
                        <input type="date" id="tanggal_akhir" class="form-input w-full mt-1 p-2 rounded-lg">
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row gap-2 mt-4 md:mt-0">
                    <button id="export-pdf-btn" class="w-full flex-1 flex items-center justify-center px-4 py-2 bg-green-600/60 hover:bg-green-600/90 text-white rounded-lg transition-colors text-sm">
                        <i class="fa fa-file-pdf mr-2"></i> Ekspor PDF
                    </button>
                    <button id="add-admin-btn" class="w-full flex-1 flex items-center justify-center px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors text-sm font-semibold hidden">
                        <i class="fa fa-user-cog mr-2"></i> Akun Admin
                    </button>
                    <button id="add-new-btn" class="w-full flex-1 flex items-center justify-center px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors text-sm font-semibold">
                        <i class="fa fa-plus mr-2"></i> Tambah Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="glass-card rounded-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-300">
                    <thead class="text-xs text-gray-300 uppercase bg-white/5">
                        <tr>
                            <th class="px-6 py-3">No. Dokumen</th>
                            <th class="px-6 py-3">Nama Pemilik</th>
                            <th class="px-6 py-3">Uplink</th>
                            <th class="px-6 py-3">Tanggal Update</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="documents-table-body">
                        <!-- Data dimuat oleh JS -->
                    </tbody>
                </table>
                <div id="no-data-message" class="text-center py-10 text-gray-400 hidden">
                    <i class="fa fa-folder-open fa-3x mb-3"></i>
                    <p>Tidak ada data yang ditemukan.</p>
                </div>
            </div>
        </div>
        
        <!-- Pagination -->
        <div id="pagination-controls" class="flex flex-col sm:flex-row items-center justify-between mt-6 text-gray-400 text-sm">
            <span id="pagination-info" class="mb-2 sm:mb-0"></span>
            <div class="flex items-center space-x-1">
                <button id="prev-page-btn" class="px-3 py-2 bg-white/10 rounded-md hover:bg-white/20 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"><i class="fa fa-chevron-left"></i></button>
                <div id="page-numbers" class="flex items-center space-x-1"></div>
                <button id="next-page-btn" class="px-3 py-2 bg-white/10 rounded-md hover:bg-white/20 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"><i class="fa fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit -->
    <div id="document-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="glass-card w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-lg flex flex-col">
            <header class="p-5 border-b border-white/10 flex justify-between items-center">
                <h3 id="modal-title" class="text-xl font-semibold text-white">Formulir Sertifikat</h3>
                <button onclick="$('#document-modal').addClass('hidden')" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </header>
            <main class="p-6 overflow-y-auto">
                <form id="document-form">
                    <input type="hidden" id="document-id">
                    <h4 class="text-lg font-semibold text-purple-300 mb-4">Data Utama</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <div class="mb-4"><label class="block mb-1 text-sm">Nama Pemilik</label><input type="text" id="nama_pemilik" class="form-input w-full p-2 rounded-md text-sm" required></div>
                            <div class="mb-4"><label class="block mb-1 text-sm">No. Passport</label><input type="text" id="passport_no" class="form-input w-full p-2 rounded-md text-sm"></div>
                            <div><label class="block mb-1 text-sm">Tanggal Lahir</label><input type="date" id="tanggal_lahir" class="form-input w-full p-2 rounded-md text-sm"></div>
                        </div>
                        <div>
                            <div class="mb-4"><label class="block mb-1 text-sm">No. Dokumen</label><input type="text" id="no_dokumen_form" class="form-input w-full p-2 rounded-md text-sm" required></div>
                            <div class="mb-4"><label class="block mb-1 text-sm">Jenis Dokumen</label><select id="jenis_dokumen_form" class="form-input w-full p-2 rounded-md text-sm"><option value="icv">ICV</option><option value="icv-haji">ICV Haji</option><option value="phqc">PHQC</option></select></div>
                            <div><label class="block mb-1 text-sm">Status</label><select id="status_form" class="form-input w-full p-2 rounded-md text-sm"><option value="Aktif">Aktif</option><option value="Kadaluarsa">Kadaluarsa</option></select></div>
                        </div>
                    </div>
                    <div class="mb-6"><label class="block mb-1 text-sm">Diterbitkan Oleh</label><input type="text" id="diterbitkan_oleh" class="form-input w-full p-2 rounded-md text-sm" required></div>

                    <div id="vaccine-fields-container" class="space-y-4"></div>
                    <button type="button" id="add-vaccine-btn" class="mt-4 px-4 py-2 text-sm bg-white/10 hover:bg-white/20 rounded-lg transition-colors"><i class="fa fa-plus mr-2"></i> Tambah Vaksin</button>
                </form>
            </main>
            <footer class="p-5 border-t border-white/10 flex justify-end space-x-3">

              <button type="button" id="save-document-btn" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold transition-colors">Simpan</button>
            </footer>
        </div>
    </div>
    
    <!-- Modal Update Uplink (Super Admin) -->
    <div id="uplink-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="glass-card w-full max-w-sm rounded-2xl shadow-lg">
            <header class="p-5 border-b border-white/10 flex justify-between items-center">

            </header>
            <main class="p-6">
                <input type="hidden" id="uplink-document-id">
                <p class="text-sm text-gray-300 mb-1">Pindahkan dokumen:</p>
                <p id="uplink-doc-info" class="font-semibold text-white mb-4"></p>
                <label for="admin-select" class="text-sm font-medium text-gray-300">Ke Admin:</label>
                <select id="admin-select" class="form-input w-full mt-1 p-2 rounded-lg"></select>
            </main>
            <footer class="p-5 border-t border-white/10 flex justify-end space-x-3">
                 <button type="button" onclick="$('#uplink-modal').addClass('hidden')" class="px-6 py-2 bg-gray-600/50 hover:bg-gray-600/80 rounded-lg transition-colors">Batal</button>
                <button type="button" id="save-uplink-btn" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold transition-colors">Simpan</button>
            </footer>
        </div>
    </div>

        <div class="glass-card w-full max-w-md rounded-2xl shadow-lg">
            <header class="p-5 border-b border-white/10 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-white">Manajemen Akun Admin</h3>
                <button onclick="$('#add-admin-modal').addClass('hidden')" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>
            </header>
            <main class="p-6">

                <div id="admin-list-container" class="mb-6 pb-4 border-b border-white/10">

                    <div id="admin-list-body" class="space-y-2 text-sm max-h-40 overflow-y-auto"></div>

                <form id="add-admin-form">

                        <input type="text" id="new-admin-username" class="form-input w-full p-3 rounded-lg transition duration-300" required>
                    </div>
                    <div class="mb-6">
                        <label for="new-admin-password" class="block text-gray-300 text-sm font-bold mb-2">Password Baru</label>
                        <input type="password" id="new-admin-password" class="form-input w-full p-3 rounded-lg transition duration-300" required>
                    </div>
                </form>
                <div id="add-admin-error" class="bg-red-500/30 text-red-300 p-3 rounded-lg mt-4 text-center hidden"></div>
            </main>
            <footer class="p-5 border-t border-white/10 flex justify-end space-x-3">
                 <button type="button" onclick="$('#add-admin-modal').addClass('hidden')" class="px-6 py-2 bg-gray-600/50 hover:bg-gray-600/80 rounded-lg transition-colors">Batal</button>
                <button type="button" id="save-admin-btn" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg font-semibold transition-colors">Simpan Akun</button>
            </footer>
        </div>
    </div>

    <div id="edit-admin-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-backdrop hidden">
        <div class="glass-card w-full max-w-sm rounded-2xl shadow-lg">

                <button onclick="$('#edit-admin-modal').addClass('hidden')" class="text-gray-400 hover:text-white text-3xl leading-none">&times;</button>

            </footer>
        </div>
    </div>
